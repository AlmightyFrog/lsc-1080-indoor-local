# Card toggles. Strict shell KEY=value lines, LF line endings (no CRLF).
# Key meanings: README "Configure". Changes apply after power-cycle;
# MOTION_* re-apply whenever motiond respawns.

OFFLINE=1
DNS_BLOCK=1

MUTE_FACTORY_PROMPT=1
# 1 = mute every /usr/share/*.mp3, also alarm sounds
MUTE_ALL_SOUNDS=0

ISP_COLOR=1
OVERRIDE_HW_SETTINGS=1

# no-login root telnet - LAN you own only
TELNET=1
TELNET_PORT=24

# off | solid | blink (blink = stock)
LED=off

# TIME=1.1.1.1 is Cloudflare anycast: NON-LOCAL. For zero WAN traffic use a
# LAN IP (router/NAS - anything answering HTTP on port 80), or off.
# Never a hostname.
TIME=1.1.1.1

# 1 = per-boot logs on the card (FAT wear); off skips them and the vendor
# app-log bind.
LOG=off

MOTION=1
MOTION_PORT=5514
MOTION_CTRL=5515
# A 6x8 superblock is active when its frame difference exceeds MOTION_ABS and
# is > MOTION_MULT x its learned noise floor; MOTION_NEED active frames within
# a MOTION_WIN-frame window open an event, MOTION_HOLD s debounce.
# Light-flicker false positives: raise MOTION_ABS.
MOTION_ABS=1200
MOTION_MULT=3
MOTION_MINB=2
MOTION_WIN=6
MOTION_NEED=3
MOTION_HOLD=4
