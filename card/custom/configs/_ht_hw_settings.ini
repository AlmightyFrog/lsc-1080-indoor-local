[audio]
;喇叭开关控制GPIO
speak_en_gpio = 69
speak_gpio_effective_level = 1
;AK_AUDIO_TYPE_PCM = 6
;AK_AUDIO_TYPE_PCM_ALAW = 17
;AK_AUDIO_TYPE_PCM_ULAW = 18
;AK_AUDIO_TYPE_AAC = 4
;AK_AUDIO_TYPE_MP3 = 2
;主通道音频编码是否开启[0,1]
main_encode_enable = 1
;主通道音频编码类型[6,17,18,4,2]
main_encode_type = 6
;子通道音频编码是否开启[0,1]
sub_encode_enable = 1
;子通道音频编码类型[6,17,18,4,2]
sub_encode_type = 4
;主通道音频解码是否开启[0,1]
main_decode_enable = 1
;主通道音频解码类型[6,17,18,4,2]
main_decode_type = 2
;子通道音频解码是否开启[0,1]
sub_decode_enable = 1
;子通道音频解码类型[6,17,18,4,2]
sub_decode_type = 18
[led]
;红外灯GPIO引脚
ir_led_gpio = 70
;红外灯有效电平值
ir_led_level = 1
;是否支持补光灯[0,1]
fill_light_led_support = 0
;补光灯控制类型[0,1]:0 GPIO,1 PWM
fill_light_led_ctrl_type = 0
;gpio控制补光灯对应的gpio引脚
fill_light_led_gpio_num = 0
;LED亮时的电平值
fill_light_led_level = 1
;pwm控制补光灯对应的pwm组
fill_light_led_pwm_num = 4
[night_mode]
;0 NIGHT_MODE_IRLED, 1 NIGHT_MODE_COLOR
night_mode_def = 0
;ircut类型[0,2]:0 IRCUT_LINE_TYPE_A,1 IRCUT_LINE_TYPE_A_B,2 IRCUT_LINE_TYPE_A_EN
ircut_type = 1
;ircut gpio引脚
ircut_gpio_a = 65
ircut_gpio_b_en = 66
;ircut_gpio白天夜晚电平[0,1] 
ircut_a_day_level = 0
ircut_b_en_day_level = 1
ircut_a_night_level = 1
ircut_b_en_night_level = 0
;光敏类型[0,1]:0 硬件光敏CDS, 1 软件光敏
ps_mode = 1
;硬件光敏类型[0,1]:0 ain, 1 gpio
ps_hw_mode = 0
;硬件光敏gpio引脚,光敏类型是gpio才有效
ps_hw_gpio_num = -1
;硬件光敏白天电平值
ps_hw_day_level = 0
;硬件光敏类型是ain时白天夜晚阈值,
ps_hw_higher_level = 2350
ps_hw_lower_level = 2000
;光敏类型是软件光敏时的参数
ps_soft_day_to_night_lum = 6300000
ps_soft_night_to_day_lum = 2000000
ps_soft_awb_night_dis_min = 50
ps_soft_awb_night_dis_max = 850
ps_soft_day_check_frame_num = 10
ps_soft_night_check_frame_num = 10
ps_soft_exp_stable_check_frame_num = 10
ps_soft_stable_wait_timeout_ms = 60000 
ps_soft_gain_r = 1280
ps_soft_offset_r = 2048
ps_soft_gain_b = 1280
ps_soft_offset_b = 2048
ps_soft_gain_rb = 1280
ps_soft_offset_rb = 2048
ps_soft_blk_check_flag = 1 
ps_soft_low_lumi_th = 5
ps_soft_high_lumi_th = 245
ps_soft_non_infrared_ratio_th = 40 
ps_soft_highlight_lumi_th = 240
ps_soft_highlight_blk_cnt_max = 192
ps_soft_lock_cnt_th = 5 
ps_soft_auto_lock_time_ms  = 60000
ps_soft_revised_dis_max_ratio = 5
[ptz]
;PTZ是否支持[0,1]
ptz_support = 0
;马达转向是否反向[0,1]
pan_clkwise_inv = 0
tilt_clkwise_inv = 1
;马达转向最大角度[45, 360]
pan_max_degree = 360
tilt_max_degree = 196
;tilt_max_degree = 130
;马达转动1圈步数
pan_total_steps = 4096
tilt_total_steps = 2230
;马达初始位置角度[45, 360]
pan_home_degree = 180
tilt_home_degree = 110
;马达转动速度[10, 100]
pan_def_speed = 60
tilt_def_speed = 60
pan_tracking_speed = 80
tilt_tracking_speed = 80

